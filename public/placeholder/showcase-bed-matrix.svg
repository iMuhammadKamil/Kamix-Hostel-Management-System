    <text x="145" y="90" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Available</text>

    <rect x="285" width="255" height="135" rx="10" fill="#141824" stroke="#252c42"/>
    <text x="301" y="28" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">East Wing • Room 102 (2-Bed)</text>
    <rect x="301" y="45" width="105" height="65" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="311" y="72" fill="#bfdbfe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">Bed 102-A</text>
    <text x="311" y="90" fill="#93c5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Occupied</text>
    <rect x="420" y="45" width="105" height="65" rx="6" fill="#78350f" stroke="#f59e0b"/>
    <text x="430" y="72" fill="#fde68a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">Bed 102-B</text>
    <text x="430" y="90" fill="#fcd34d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Reserved</text>
