<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" fill="none">
  <rect width="600" height="420" rx="16" fill="#0d1017" stroke="#22283a" stroke-width="2"/>
  <rect x="20" y="20" width="560" height="40" rx="8" fill="#151926"/>
