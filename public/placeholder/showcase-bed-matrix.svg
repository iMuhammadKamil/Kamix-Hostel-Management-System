    <text x="26" y="90" fill="#93c5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Occupied</text>
    <rect x="135" y="45" width="105" height="65" rx="6" fill="#064e3b" stroke="#10b981"/>
