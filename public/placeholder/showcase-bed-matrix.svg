  <rect x="150" y="390" width="300" height="22" rx="4" fill="#000000" fill-opacity="0.7"/>
  <text x="165" y="405" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" font-weight="600">[PLACEHOLDER: SMART ALLOCATION MOCKUP]</text>
